name: Build and Package Installer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4.2.2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore dependencies
      run: nuget restore AccountingSystem.sln

    - name: Build solution
      run: msbuild AccountingSystem.sln /p:Configuration=Release

    - name: Install Inno Setup
      shell: cmd
      run: |
        choco install innosetup --no-progress -y
        echo C:\Program Files (x86)\Inno Setup 6>> %GITHUB_PATH%

    - name: Create installer with Inno Setup
      shell: cmd
      run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/installer_script.iss'

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: Installer
        path: installer/Output/NaeqebsAccountingSystemSetup.exe
