name: Build and Package Installer

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v3

    - name: Restore dependencies
      run: nuget restore AccountingSystem.sln

    - name: Build solution
      run: msbuild AccountingSystem.sln /p:Configuration=Release

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Create installer with Inno Setup
      run: iscc installer/installer_script.iss

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: Installer
        path: installer/Output/NaeqebsAccountingSystemSetup.exe
