name: CI - Build and Package Installer

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SIGN_PFX: ${{ secrets.SIGN_PFX }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. Setup Node.js 24
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js
        shell: pwsh
        run: |
          Write-Host "Node.js version:"
          node --version

          Write-Host "NPM version:"
          npm --version


      # ============================================================
      # 3. Setup .NET 8
      # ============================================================

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET
        shell: pwsh
        run: |
          Write-Host ".NET SDK version:"
          dotnet --version

          Write-Host ".NET information:"
          dotnet --info


      # ============================================================
      # 4. Restore NuGet packages
      # ============================================================

      - name: Restore NuGet packages
        run: dotnet restore AccountingSystem.sln


      # ============================================================
      # 5. Install Inno Setup
      # ============================================================

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

          $innoPath = "C:\Program Files (x86)\Inno Setup 6"

          if (-not (Test-Path $innoPath)) {
              throw "Inno Setup installation directory not found: $innoPath"
          }

          $innoPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          Write-Host "Inno Setup installed successfully."
          Write-Host "Inno Setup path: $innoPath"


      # ============================================================
      # 6. Build solution
      # =====
