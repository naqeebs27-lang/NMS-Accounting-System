name: Build and Package Installer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Show Node.js version
        run: node --version

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore AccountingSystem.App/AccountingSystem.App.csproj

      - name: Build solution
        run: dotnet build AccountingSystem.sln --configuration Release --no-restore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $innoPath = 'C:\Program Files (x86)\Inno Setup 6'
          if (-not (Test-Path (Join-Path $innoPath 'ISCC.exe'))) {
            throw 'Inno Setup compiler was not found.'
          }
          $innoPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          & .\build-installer.ps1 -Configuration Release -Runtime win-x64

      - name: Verify publish output
        shell: pwsh
        run: |
          $publishPath = Join-Path $env:GITHUB_WORKSPACE 'publish\win-x64'
          $installerPath = Join-Path $env:GITHUB_WORKSPACE 'installer\NaqeebsAccountingInstaller.exe'
          if (-not (Test-Path $publishPath)) { throw "Publish output not found: $publishPath" }
          if (-not (Test-Path $installerPath)) { throw "Installer not found: $installerPath" }
          Get-ChildItem $publishPath -Recurse

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64
          path: publish/win-x64/**
          if-no-files-found: error

