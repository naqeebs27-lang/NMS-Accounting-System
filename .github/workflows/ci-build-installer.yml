name: CI - Build and Package Installer

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      SIGN_PFX: ${{ secrets.SIGN_PFX }}
      SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}

    steps:

      # ============================================================
      # Checkout source code
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # Setup Node.js 24
      # ============================================================

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify Node.js
        shell: pwsh
        run: |
          Write-Host "Node.js version:"
          node --version

          Write-Host "NPM version:"
          npm --version


      # ============================================================
      # Setup .NET 8
      # ============================================================

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET
        shell: pwsh
        run: |
          Write-Host ".NET SDK:"
          dotnet --version

          Write-Host ".NET SDK information:"
          dotnet --info


      # ============================================================
      # Restore
      # ============================================================

      - name: Restore NuGet packages
        run: dotnet restore AccountingSystem.App/AccountingSystem.App.csproj


      # ============================================================
      # Install Inno Setup
      # ============================================================

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

          $innoPath = "C:\Program Files (x86)\Inno Setup 6"

          $env:Path += ";$innoPath"

          $innoPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          Write-Host "Inno Setup installed."


      # ============================================================
      # Build solution
      # ============================================================

      - name: Build solution
        run: dotnet build AccountingSystem.sln -c Release --no-restore


      # ============================================================
      # Publish application and create installer
      # ============================================================

      - name: Publish and build installer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest

          Write-Host "Running build-installer.ps1..."

          .\build-installer.ps1 `
            -Configuration Release `
            -Runtime win-x64


      # ============================================================
      # Code signing
      # Only runs when signing secrets exist
      # ============================================================

      - name: Code sign published binaries and installer
        if: ${{ env.SIGN_PFX != '' && env.SIGN_PASSWORD != '' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest

          Write-Host "Preparing certificate file..."

          $pfxBytes = [System.Convert]::FromBase64String(
            $env:
