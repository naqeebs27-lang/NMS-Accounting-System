name: CI - Build and Package Installer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore AccountingSystem.App/AccountingSystem.App.csproj

      - name: Install Inno Setup (Chocolatey)
        run: |
          choco install innosetup -y
          refreshenv

      - name: Build solution
        run: dotnet build AccountingSystem.sln -c Release

      - name: Publish and build installer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          Write-Host "Running build-installer.ps1..."
          .\build-installer.ps1 -Configuration Release -Runtime win-x64

      - name: Code sign published binaries and installer (optional)
        if: ${{ secrets.SIGN_PFX != '' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          Write-Host "Preparing certificate file from SIGN_PFX secret..."
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.SIGN_PFX }}")
          $pfxPath = "cert.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          # Find signtool
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }

          $timestamp = 'http://timestamp.digicert.com'

          # Sign published executables
          $publishDir = "$env:GITHUB_WORKSPACE\publish\win-x64"
          if (Test-Path $publishDir) {
              Get-ChildItem $publishDir -Recurse -Include *.exe | ForEach-Object {
                  Write-Host "Signing published file: $($_.FullName)"
                  & $signtool sign /fd SHA256 /f $pfxPath /p "${{ secrets.SIGN_PASSWORD }}" /tr $timestamp /td SHA256 $_.FullName
              }
          } else { Write-Warning "Publish directory not found: $publishDir" }

          # Sign installer exe produced by Inno Setup
          $installerDir = "$env:GITHUB_WORKSPACE\installer"
          if (Test-Path $installerDir) {
              Get-ChildItem $installerDir -Recurse -Include *.exe | ForEach-Object {
                  Write-Host "Signing installer file: $($_.FullName)"
                  & $signtool sign /fd SHA256 /f $pfxPath /p "${{ secrets.SIGN_PASSWORD }}" /tr $timestamp /td SHA256 $_.FullName
              }
          } else { Write-Warning "Installer directory not found: $installerDir" }

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64
          path: publish/win-x64/**

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NaqeebsAccounting-installer
          path: installer/**
